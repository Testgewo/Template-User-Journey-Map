<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <title>Journey-Map-Vorlage</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <a class="skip-link" href="#inhalt">Zum Inhalt springen</a>

    <header class="kopf">
      <div class="kopf-zeile">
        <p class="app-name">Journey-Map-Vorlage <span class="kennzeichen">Prototyp</span></p>
        <div class="datei-aktionen" role="group" aria-label="Datei">
          <button type="button" id="btn-neu">Neu</button>
          <button type="button" id="btn-oeffnen">Öffnen …</button>
          <button type="button" id="btn-speichern" class="primaer">Speichern</button>
          <button type="button" id="btn-beispiel">Beispiel laden</button>
          <input type="file" id="datei-eingabe" accept=".json,application/json" hidden />
        </div>
      </div>
      <div class="dokument-zeile">
        <h1 id="dok-titel">Ohne Titel</h1>
        <ul class="dok-meta" aria-label="Versionsstand">
          <li id="dok-status"></li>
          <li id="dok-version"></li>
          <li id="dok-stand"></li>
          <li id="dok-gespeichert"></li>
        </ul>
        <button type="button" id="btn-pruefstand" class="pruefstand"></button>
      </div>
    </header>

    <nav class="tab-leiste" aria-label="Arbeitsschritte">
      <div role="tablist" id="tabs" aria-label="Arbeitsschritte"></div>
    </nav>

    <main id="inhalt" tabindex="-1">
      <section role="tabpanel" id="panel-rahmen" aria-labelledby="tab-rahmen" tabindex="-1"></section>
      <section role="tabpanel" id="panel-material" aria-labelledby="tab-material" tabindex="-1" hidden></section>
      <section role="tabpanel" id="panel-schritte" aria-labelledby="tab-schritte" tabindex="-1" hidden></section>
      <section role="tabpanel" id="panel-map" aria-labelledby="tab-map" tabindex="-1" hidden></section>
      <section role="tabpanel" id="panel-pruefung" aria-labelledby="tab-pruefung" tabindex="-1" hidden></section>
    </main>

    <div id="meldung" class="meldung" role="status" aria-live="polite"></div>

    <footer class="fuss">
      Prototyp · nur fiktive oder anonymisierte Inhalte · keine Rohdaten, Transkripte oder personenbezogenen Daten ·
      Die Map wird nur als Datei auf deinem Rechner gespeichert.
    </footer>

    <!-- Wird nur beim Drucken bzw. PDF-Export angezeigt -->
    <div id="druck" aria-hidden="true"></div>

    <noscript>Diese Vorlage braucht JavaScript im Browser.</noscript>

    <script src="js/model.js"></script>
    <script src="js/checks.js"></script>
    <script src="js/beispiel.js"></script>
    <script src="js/import.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
